<script>
  // ==================== STATE ====================
  const DEFAULT_COLORS = [
    '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e',
    '#f59e0b', '#10b981', '#06b6d4', '#3b82f6',
    '#14b8a6', '#a855f7', '#ef4444', '#eab308',
  ];
  const GAY_COLORS = [
    '#ff6fa1', '#ec2c69', '#f472b6', '#c084fc',
    '#fb7185', '#fda4af', '#f9a8d4', '#e879f9',
    '#f0abfc', '#fbcfe8', '#ff9bbf', '#ffc2d9',
  ];

  let names = [];
  let currentAngle = 0;
  let isSpinning = false;

  // ==================== ELEMENTS ====================
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const namesList = document.getElementById('namesList');
  const emptyMsg = document.getElementById('emptyMsg');
  const countBadge = document.getElementById('countBadge');
  const clearBtn = document.getElementById('clearBtn');
  const spinBtn = document.getElementById('spinBtn');
  const resultContent = document.getElementById('resultContent');
  const resultLabel = document.getElementById('resultLabel');
  const resultCard = document.getElementById('resultCard');
  const mainTitle = document.getElementById('mainTitle');
  const subTitle = document.getElementById('subTitle');
  const leftPanel = document.getElementById('leftPanel');
  const resetThemeBtn = document.getElementById('resetThemeBtn');
  const sparkleContainer = document.getElementById('sparkleContainer');
  const body = document.body;

  // ==================== HELPERS ====================
  function getColors() {
    return body.classList.contains('gay-theme') ? GAY_COLORS : DEFAULT_COLORS;
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==================== NAME MANAGEMENT ====================
  function addName(name) {
    name = name.trim();
    if (!name) return;
    if (names.includes(name)) {
      nameInput.classList.add('ring-2', 'ring-red-500');
      setTimeout(() => nameInput.classList.remove('ring-2', 'ring-red-500'), 600);
      return;
    }
    names.push(name);
    renderNames();
    drawWheel();
  }
  function removeName(name) {
    names = names.filter(n => n !== name);
    renderNames();
    drawWheel();
  }
  function clearAll() {
    names = [];
    renderNames();
    drawWheel();
  }
  function renderNames() {
    countBadge.textContent = names.length;
    if (names.length === 0) {
      namesList.innerHTML = '';
      namesList.appendChild(emptyMsg);
      return;
    }
    namesList.innerHTML = '';
    const colors = getColors();
    names.forEach((name) => {
      const i = names.indexOf(name);
      const chip = document.createElement('div');
      chip.className = 'name-chip inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium text-white';
      chip.style.backgroundColor = colors[i % colors.length];
      chip.innerHTML = `
        <span>${escapeHtml(name)}</span>
        <button class="remove-btn hover:bg-white/25 rounded-full w-5 h-5 flex items-center justify-center text-xs leading-none transition" data-name="${escapeHtml(name)}">✕</button>
      `;
      namesList.appendChild(chip);
    });
    namesList.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeName(btn.dataset.name));
    });
  }

  // ==================== WHEEL DRAWING ====================
  function drawWheel() {
    const size = canvas.width;
    const cx = size / 2;
    const cy = size / 2;
    const radius = size / 2 - 8;

    ctx.clearRect(0, 0, size, size);

    // Outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 5, 0, Math.PI * 2);
    const isGay = body.classList.contains('gay-theme');
    ctx.fillStyle = isGay ? '#ec2c69' : '#6366f1';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    if (names.length === 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = isGay ? '#ffe0ec' : '#f1f5f9';
      ctx.fill();
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(currentAngle);
      ctx.fillStyle = isGay ? '#ec2c69' : '#64748b';
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Add Names 👀', 0, 0);
      ctx.restore();
      return;
    }

    if (names.length === 1) {
      const colors = getColors();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = colors[0];
      ctx.fill();
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(currentAngle);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 4;
      ctx.fillText(escapeHtml(names[0]), 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      return;
    }

    const colors = getColors();
    const segAngle = (Math.PI * 2) / names.length;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(currentAngle);

    for (let i = 0; i < names.length; i++) {
      const start = i * segAngle;
      const end = start + segAngle;
      const mid = start + segAngle / 2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      const fontSize = Math.max(12, Math.min(18, 150 / Math.max(names[i].length, 4)));
      ctx.font = `bold ${fontSize}px system-ui, -apple-system, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 3;
      const text = names[i].length > 14 ? names[i].slice(0, 13) + '…' : names[i];
      ctx.fillText(escapeHtml(text), radius - 18, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Inner hub
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = isGay ? '#ec2c69' : '#6366f1';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = isGay ? '#ec2c69' : '#6366f1';
    ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAY?', 0, 0);

    ctx.restore();
  }

  // ==================== SPIN LOGIC ====================
  function spinWheel() {
    if (isSpinning) return;
    if (names.length < 2) {
      flashWarning(resultCard);
      return;
    }

    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.style.opacity = '0.7';
    spinBtn.textContent = '...';

    const winnerIndex = Math.floor(Math.random() * names.length);
    const segAngle = (Math.PI * 2) / names.length;

    const winnerMid = winnerIndex * segAngle + segAngle / 2;
    const targetAngleForWinner = -Math.PI / 2 - winnerMid;

    const extraSpins = 6;
    const finalAngle = currentAngle + extraSpins * Math.PI * 2 + (targetAngleForWinner - ((currentAngle) % (Math.PI * 2)));

    const startAngle = currentAngle;
    const delta = finalAngle - startAngle;
    const duration = 5200;
    const startTime = performance.now();

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(t);
      currentAngle = startAngle + delta * eased;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        finishSpin(names[winnerIndex]);
      }
    }
    requestAnimationFrame(animate);
  }

  function finishSpin(winnerName) {
    isSpinning = false;
    spinBtn.disabled = false;
    spinBtn.style.opacity = '1';
    spinBtn.innerHTML = 'SPIN<span class="inline-block ml-0.5" style="line-height:1;">🎯</span>';

    resultLabel.textContent = '🏆 The Gay of the Day is...';
    resultContent.innerHTML = `
      <div class="space-y-1.5">
        <div class="text-4xl md:text-5xl font-extrabold animate-wiggle text-gay-500">
          ${escapeHtml(winnerName)} <span class="inline-block" style="line-height:1;">🏳️‍🌈</span>
        </div>
        <p class="text-sm md:text-base text-gay-600 font-medium">Congratulations gay! <span class="inline-block" style="line-height:1;">💅✨</span></p>
      </div>
    `;

    activateGayTheme();
    burstHearts();
  }

  function flashWarning(el) {
    el.classList.add('ring-2', 'ring-red-500');
    const original = resultContent.innerHTML;
    resultContent.innerHTML = '<span class="text-red-500 text-base font-medium">Add at least 2 names first!</span>';
    setTimeout(() => {
      el.classList.remove('ring-2', 'ring-red-500');
      resultContent.innerHTML = original;
    }, 1200);
  }

  // ==================== THEME SWITCHING ====================
  function activateGayTheme() {
    body.classList.remove('default-theme');
    body.classList.add('gay-theme');

    // Title: keep emoji separate so it renders cleanly
    mainTitle.innerHTML = `
      <span class="title-emoji mr-2 inline-block align-middle" style="font-size:1em;line-height:1;">🏳️‍🌈</span><span class="title-text align-middle text-gay-500">Gay Wheel Activated</span> <span class="title-emoji ml-1 inline-block align-middle" style="font-size:1em;line-height:1;">💕</span>
    `;
    subTitle.innerHTML = `
      <span class="sub-emoji inline-block" style="line-height:1;">💖✨</span> <span class="sub-text text-gay-500">Everyone is gay now!</span>
    `;

    leftPanel.className = 'bg-white border border-pink-200 rounded-xl p-6';
    leftPanel.querySelectorAll('h2').forEach(h => h.classList.remove('text-slate-800'), void 0);
    leftPanel.querySelector('h2').classList.add('text-gay-600');

    nameInput.className = 'flex-1 bg-white border border-pink-200 rounded-lg px-4 py-2.5 text-slate-900 placeholder-pink-300 focus:border-gay-500 focus:ring-2 focus:ring-pink-100 transition';
    addBtn.className = 'bg-gay-500 hover:bg-gay-600 active:bg-gay-600 text-white font-medium px-5 py-2.5 rounded-lg transition';
    clearBtn.className = 'flex-1 bg-pink-50 hover:bg-red-50 hover:text-red-700 text-slate-700 font-medium px-4 py-2.5 rounded-lg transition text-sm border border-pink-200 hover:border-red-200';

    leftPanel.querySelectorAll('.quick-add').forEach(b => {
      b.className = 'quick-add text-xs bg-pink-50 hover:bg-pink-100 text-slate-700 px-3 py-1.5 rounded-md border border-pink-200 transition';
    });
    leftPanel.querySelector('#namesList').className = 'flex flex-wrap gap-2 min-h-[80px] max-h-60 overflow-y-auto p-3 rounded-lg bg-pink-50 border border-pink-200';
    if (emptyMsg.parentNode) emptyMsg.className = 'w-full text-center text-pink-400 py-6 italic text-sm';

    countBadge.className = 'ml-auto bg-gay-500 text-white text-xs font-medium px-2.5 py-1 rounded-full';

    resultCard.className = 'w-full max-w-md bg-white border-2 border-pink-300 rounded-xl p-6 text-center min-h-[130px] flex flex-col justify-center items-center';
    resultLabel.classList.remove('text-slate-400');
    resultLabel.classList.add('text-gay-500', 'font-semibold');

    canvas.parentElement.className = 'bg-white p-4 rounded-2xl border-2 border-pink-200';

    spinBtn.className = 'bg-gay-500 hover:bg-gay-600 active:bg-gay-600 transition absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full text-white font-semibold border-4 border-white z-20';

    resetThemeBtn.classList.remove('hidden');
    resetThemeBtn.classList.add('inline-flex', 'items-center', 'justify-center');

    renderNames();
    drawWheel();
    showSparkles();
  }

  function resetTheme() {
    body.classList.add('default-theme');
    body.classList.remove('gay-theme');

    mainTitle.innerHTML = `
      <span class="title-emoji mr-2 inline-block align-middle" style="font-size:1em;line-height:1;">🎡</span><span class="title-text align-middle text-slate-900">Spin The Wheel</span>
    `;
    subTitle.innerHTML = `
      <span class="sub-emoji inline-block" style="line-height:1;">👀</span> <span class="sub-text text-slate-500">Find out who's the gay of the day!</span>
    `;

    leftPanel.className = 'bg-white border border-slate-200 rounded-xl p-6';
    const h2 = leftPanel.querySelector('h2');
    h2.classList.remove('text-gay-600');
    h2.classList.add('text-slate-800');

    nameInput.className = 'flex-1 bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition';
    addBtn.className = 'bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg transition';
    clearBtn.className = 'flex-1 bg-slate-50 hover:bg-red-50 hover:text-red-700 text-slate-700 font-medium px-4 py-2.5 rounded-lg transition text-sm border border-slate-200 hover:border-red-200';

    leftPanel.querySelectorAll('.quick-add').forEach(b => {
      b.className = 'quick-add text-xs bg-slate-50 hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md border border-slate-200 transition';
    });
    leftPanel.querySelector('#namesList').className = 'flex flex-wrap gap-2 min-h-[80px] max-h-60 overflow-y-auto p-3 rounded-lg bg-slate-50 border border-slate-200';
    if (emptyMsg.parentNode) emptyMsg.className = 'w-full text-center text-slate-400 py-6 italic text-sm';

    countBadge.className = 'ml-auto bg-indigo-500 text-white text-xs font-medium px-2.5 py-1 rounded-full';

    resultCard.className = 'w-full max-w-md bg-white border border-slate-200 rounded-xl p-6 text-center min-h-[130px] flex flex-col justify-center items-center';
    resultLabel.classList.add('text-slate-400');
    resultLabel.classList.remove('text-gay-500', 'font-semibold');

    canvas.parentElement.className = 'bg-white p-4 rounded-2xl border border-slate-200';

    spinBtn.className = 'bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 transition absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full text-white font-semibold border-4 border-white z-20';
    if (!spinBtn.innerHTML.includes('🎯')) {
      spinBtn.innerHTML = 'SPIN<span class="inline-block ml-0.5" style="line-height:1;">🎯</span>';
    }

    resetThemeBtn.classList.add('hidden');
    resetThemeBtn.classList.remove('inline-flex', 'items-center', 'justify-center');

    sparkleContainer.innerHTML = '';
    renderNames();
    drawWheel();
  }

  // ==================== PARTICLES & SPARKLES ====================
  function showSparkles() {
    sparkleContainer.innerHTML = '';
    const symbols = ['✨', '💖', '💕', '🌸', '🌈', '💅', '🎀', '💗', '🌺', '🦄'];
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'sparkle-star text-xl md:text-2xl';
      star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDelay = (Math.random() * 2) + 's';
      star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      sparkleContainer.appendChild(star);
    }
  }

  function burstHearts() {
    const emojis = ['💖', '💕', '💗', '💘', '💝', '🌈', '✨', '🌸', '🎀', '🦄', '💅', '👑'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-particle text-xl md:text-2xl animate-floatHeart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = (10 + Math.random() * 80) + 'vw';
        heart.style.bottom = '-60px';
        heart.style.animationDuration = (4 + Math.random() * 4) + 's';
        heart.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 9000);
      }, i * 40);
    }
  }

  // ==================== EVENTS ====================
  addBtn.addEventListener('click', () => {
    addName(nameInput.value);
    nameInput.value = '';
    nameInput.focus();
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      addName(nameInput.value);
      nameInput.value = '';
    }
  });
  clearBtn.addEventListener('click', () => {
    if (names.length && confirm('Remove all names?')) clearAll();
  });
  spinBtn.addEventListener('click', spinWheel);
  resetThemeBtn.addEventListener('click', resetTheme);
  document.querySelectorAll('.quick-add').forEach(b => {
    b.addEventListener('click', () => addName(b.textContent));
  });

  // ==================== INIT ====================
  drawWheel();
  renderNames();

  function fitWheel() {
    const maxW = Math.min(window.innerWidth - 64, 400);
    if (maxW < 400) {
      canvas.style.width = maxW + 'px';
      canvas.style.height = maxW + 'px';
    } else {
      canvas.style.width = '';
      canvas.style.height = '';
    }
  }
  window.addEventListener('resize', fitWheel);
  fitWheel();
</script>

</body>
</html>
